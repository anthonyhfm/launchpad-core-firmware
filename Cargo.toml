[workspace]
members = [
  ".",
  "xtask",
]
default-members = ["."]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.2.1"
publish = false
license = "GPL-3.0-only"
authors = [
  "Anthony Hofmeister <https://github.com/anthonyhfm>",
  "zeph <https://github.com/ZephyrCodesStuff>",
]

[package]
name = "core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "core_firmware"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "core"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

# Optional dependencies enabled per target device
critical-section = { version = "1.2.0", optional = true }
embassy-embedded-hal = { version = "0.6.0", optional = true }
embassy-executor = { version = "0.10.0", optional = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = { version = "0.1.2", optional = true }
embassy-stm32 = { version = "0.6.0", optional = true, features = ["time-driver-tim4"] }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.1", optional = true, features = ["tick-hz-32_768"] }
embedded-hal = { version = "0.2.7", optional = true }
embedded-hal-nb = { version = "1.0.0", optional = true }
embedded-storage = { version = "0.3.1", optional = true }
heapless = { version = "0.9.3", optional = true }
spi-memory = { version = "0.2.0", optional = true }
static_cell = { version = "2.1.1", optional = true }
stm32-metapac = { version = "21.0.0", optional = true }

[features]
default = []
no-setup-btn = []
pressure-sensitive = []
rgb-color = []

launchpad-x = [
  "no-setup-btn",
  "pressure-sensitive",
  "rgb-color",
  "dep:critical-section",
  "dep:embassy-executor",
  "dep:embassy-futures",
  "dep:embassy-stm32",
  "embassy-stm32/stm32f401re",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:embedded-storage",
  "dep:heapless",
  "dep:spi-memory",
  "dep:static_cell",
  "dep:stm32-metapac",
  "stm32-metapac/stm32f401re",
  "cortex-m/critical-section-single-core",
]

launchpad-mini-mk3 = [
  "no-setup-btn",
  "rgb-color",
  "dep:critical-section",
  "dep:embassy-executor",
  "dep:embassy-futures",
  "dep:embassy-stm32",
  "embassy-stm32/stm32f401re",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:embedded-storage",
  "dep:heapless",
  "dep:spi-memory",
  "dep:static_cell",
  "dep:stm32-metapac",
  "stm32-metapac/stm32f401re",
  "cortex-m/critical-section-single-core",
]

launchpad-mk2 = [
  "no-setup-btn",
  "rgb-color",
  "dep:critical-section",
  "critical-section/restore-state-u8",
  "dep:embassy-executor",
  "dep:embassy-stm32",
  "embassy-stm32/stm32f103rb",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:embedded-storage",
  "dep:heapless",
  "dep:static_cell",
  "dep:stm32-metapac",
  "stm32-metapac/stm32f103rb",
  "cortex-m-rt/set-sp",
  "cortex-m-rt/set-vtor",
]

launchpad-pro = [
  "pressure-sensitive",
  "rgb-color",
  "dep:critical-section",
  "critical-section/restore-state-u8",
  "dep:embassy-executor",
  "dep:embassy-stm32",
  "embassy-stm32/stm32f103rb",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:embedded-storage",
  "dep:heapless",
  "dep:static_cell",
  "dep:stm32-metapac",
  "stm32-metapac/stm32f103rb",
  "cortex-m-rt/set-sp",
  "cortex-m-rt/set-vtor",
]

launchpad-pro-mk3 = [
  "pressure-sensitive",
  "rgb-color",
  "dep:critical-section",
  "dep:embassy-embedded-hal",
  "dep:embassy-executor",
  "dep:embassy-futures",
  "dep:embassy-stm32",
  "embassy-stm32/stm32f745ve",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:embedded-hal",
  "dep:embedded-hal-nb",
  "dep:embedded-storage",
  "dep:heapless",
  "dep:spi-memory",
  "dep:static_cell",
  "dep:stm32-metapac",
  "stm32-metapac/stm32f745ve",
  "cortex-m/critical-section-single-core",
  "cortex-m-rt/set-sp",
  "cortex-m-rt/set-vtor",
]

launchpad-s = [
  "launchpad-s-and-mini-common",
]

launchpad-mini-mk1 = [
  "launchpad-s-and-mini-common",
]

launchpad-s-and-mini-common = [
  "no-setup-btn",
  "dep:stm32-metapac",
  "stm32-metapac/stm32f103c8",
  "cortex-m/critical-section-single-core",
  "cortex-m-rt/set-sp",
  "cortex-m-rt/set-vtor",
  "cortex-m-rt/device",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"

[profile.dev]
opt-level = "z"
lto = "fat"
